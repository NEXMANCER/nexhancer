  <title>Nexmancer — Start with the problem, not the request</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>
  </noscript>
</head>
<body>
  <div id="__bundler_placeholder">Loading Nexmancer — Start with the problem, not the request...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ow: hidden\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 96px 24px 112px; display: flex; gap: 64px; align-items: center; flex-wrap: wrap\">\n<div style=\"flex: 1 1 520px; display: flex; flex-direction: column; gap: 28px\">\n<div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.14em; color: {{accent}}\">EXPERTISE-LED TECHNOLOGY INNOVATION<\u002Fdiv>\n<h1 style=\"margin: 0; font-size: clamp(40px, 5.4vw, 68px); line-height: 1.04; font-weight: 800; letter-spacing: -0.02em\">We start with the problem,<br><span style=\"color: {{accent}}\">not the request.<\u002Fspan><\u002Fh1>\n<p style=\"margin: 0; font-size: 19px; line-height: 1.6; color: #B8C2D6; max-width: 560px\">Nexmancer analyses complex problems, evaluates technology choices and engineers secure solutions. We help organisations decide what to build, buy, adopt or avoid, and then we build the right thing.<\u002Fp>\n<div style=\"display: flex; gap: 14px; flex-wrap: wrap\">\n<a class=\"nx-btn\" href=\"#contact\" style=\"background: {{accent}}; color: #0F1B33; padding: 16px 26px; border-radius: 12px; font-weight: 800; font-size: 16px; min-height: 52px; box-sizing: border-box; display: inline-flex; align-items: center\">Book a technology review<\u002Fa>\n<a class=\"nx-ghost\" href=\"#sensighty\" style=\"color: #FFFFFF; border: 1px solid rgba(255,255,255,0.28); padding: 16px 26px; border-radius: 12px; font-weight: 700; font-size: 16px; min-height: 52px; box-sizing: border-box; display: inline-flex; align-items: center\">Explore Sensighty<\u002Fa>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 22px; flex-wrap: wrap; font-size: 14px; font-weight: 600; color: #8C99B3\">\n<span>Human expertise first<\u002Fspan><span aria-hidden=\"true\">·<\u002Fspan><span>AI as an accelerator<\u002Fspan><span aria-hidden=\"true\">·<\u002Fspan><span>Security by design<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"flex: 1 1 420px; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.12em; color: #8C99B3\">HOW AN ENGAGEMENT CHANGES · ILLUSTRATIVE<\u002Fdiv>\n<div style=\"background: #17264A; border: 1px solid rgba(255,255,255,0.08); border-radius: 18px; padding: 24px 26px; display: flex; flex-direction: column; gap: 8px\">\n<div style=\"font-size: 13px; font-weight: 700; color: #8C99B3; letter-spacing: 0.06em\">THE REQUEST<\u002Fdiv>\n<div style=\"font-size: 20px; font-weight: 600; color: #DCE3EF; line-height: 1.4\">“Build us an AI chatbot for employee training.”<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; justify-content: center\"><svg width=\"24\" height=\"28\" sc-camel-view-box=\"0 0 24 28\" fill=\"none\" aria-hidden=\"true\"><path d=\"M12 2v22M4 16l8 8 8-8\" stroke=\"#8C99B3\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<div style=\"background: #17264A; border: 1px solid {{accent}}; border-radius: 18px; padding: 24px 26px; display: flex; flex-direction: column; gap: 8px\">\n<div style=\"font-size: 13px; font-weight: 700; color: {{accent}}; letter-spacing: 0.06em\">THE ROOT PROBLEM<\u002Fdiv>\n<div style=\"font-size: 20px; font-weight: 600; color: #FFFFFF; line-height: 1.4\">Employees sit through content they already know, and nobody measures what they actually learned.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; justify-content: center\"><svg width=\"24\" height=\"28\" sc-camel-view-box=\"0 0 24 28\" fill=\"none\" aria-hidden=\"true\"><path d=\"M12 2v22M4 16l8 8 8-8\" stroke=\"#8C99B3\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<div style=\"background: {{accent}}; color: #0F1B33; border-radius: 18px; padding: 24px 26px; display: flex; flex-direction: column; gap: 8px\">\n<div style=\"font-size: 13px; font-weight: 800; letter-spacing: 0.06em\">THE RECOMMENDATION<\u002Fdiv>\n<div style=\"font-size: 20px; font-weight: 700; line-height: 1.4\">Diagnose first. Adaptive assessment that skips what people know and targets the real gaps.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- APPROACH -->\n<section id=\"approach\" style=\"padding: 112px 24px\">\n<div style=\"max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px\">\n<div style=\"display: flex; flex-direction: column; gap: 16px; max-width: 760px\">\n<div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.14em; color: #0E7490\">OUR METHOD<\u002Fdiv>\n<h2 style=\"margin: 0; font-size: clamp(32px, 3.6vw, 46px); line-height: 1.1; font-weight: 800; letter-spacing: -0.015em\">Most firms start at “Build”. We get there last.<\u002Fh2>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.6; color: #4A5A78\">Development is the outcome of engineering analysis, not the starting point. Select a step to see what happens there.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px\">\n<sc-for list=\"{{steps}}\" as=\"s\" hint-placeholder-count=\"6\">\n<button class=\"nx-step\" type=\"button\" sc-camel-on-click=\"{{s.pick}}\" aria-pressed=\"{{s.pressed}}\" style=\"{{s.style}}\">\n<span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; opacity: 0.75\">{{s.num}}<\u002Fspan>\n<span style=\"font-size: 21px; font-weight: 800\">{{s.name}}<\u002Fspan>\n<span style=\"font-size: 13px; font-weight: 700; letter-spacing: 0.04em; opacity: 0.8\">{{s.tag}}<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n\n<div style=\"background: #FFFFFF; border: 1px solid #E1E6EF; border-radius: 18px; padding: 28px 32px; display: flex; gap: 28px; align-items: flex-start; flex-wrap: wrap\">\n<div style=\"flex: 0 0 auto; width: 56px; height: 56px; border-radius: 14px; background: #0F1B33; color: {{accent}}; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 18px\">{{active.num}}<\u002Fdiv>\n<div style=\"flex: 1 1 400px; display: flex; flex-direction: column; gap: 8px\">\n<div style=\"font-size: 24px; font-weight: 800\">{{active.name}}<\u002Fdiv>\n<div style=\"font-size: 17px; line-height: 1.6; color: #4A5A78\">{{active.desc}}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- PILLARS -->\n<section id=\"pillars\" style=\"padding: 112px 24px; background: #FFFFFF; border-top: 1px solid #E1E6EF; border-bottom: 1px solid #E1E6EF\">\n<div style=\"max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px\">\n<div style=\"display: flex; flex-direction: column; gap: 16px; max-width: 760px\">\n<div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.14em; color: #0E7490\">THREE FOCUS AREAS<\u002Fdiv>\n<h2 style=\"margin: 0; font-size: clamp(32px, 3.6vw, 46px); line-height: 1.1; font-weight: 800; letter-spacing: -0.015em\">Deep in a few domains, instead of shallow in dozens.<\u002Fh2>\n<\u002Fdiv>\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 22px\">\n\n<article style=\"background: #0F1B33; color: #FFFFFF; border-radius: 22px; padding: 36px 32px; display: flex; flex-direction: column; gap: 20px\">\n<div style=\"width: 56px; height: 56px; border-radius: 14px; background: rgba(34,184,212,0.14); display: flex; align-items: center; justify-content: center\">\n<svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"{{accent}}\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 9l9-5 9 5-9 5-9-5z\"><\u002Fpath><path d=\"M7 11.2V16c0 1.4 2.2 3 5 3s5-1.6 5-3v-4.8\"><\u002Fpath><path d=\"M21 9v6\"><\u002Fpath><\u002Fsvg>\n<\u002Fdiv>\n<div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.12em; color: {{accent}}\">01 · AI-DRIVEN EDTECH<\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 28px; font-weight: 800; line-height: 1.15\">Learning &amp; Skills Intelligence<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #B8C2D6\">Adaptive learning and assessment that measures what people actually know, then personalises what they learn next.<\u002Fp>\n<ul style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; font-size: 15px; color: #DCE3EF\">\n<li>Adaptive assessment &amp; learner modelling<\u002Fli>\n<li>Mastery tracking &amp; skill intelligence<\u002Fli>\n<li>Workforce upskilling &amp; learning analytics<\u002Fli>\n<\u002Ful>\n<div style=\"margin-top: auto; padding-top: 18px; border-top: 1px solid rgba(255,255,255,0.12); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap\">\n<span style=\"font-size: 14px; color: #8C99B3\">Flagship product<\u002Fspan>\n<a href=\"#sensighty\" style=\"color: {{accent}}; font-weight: 800; font-size: 16px; min-height: 44px; display: inline-flex; align-items: center\">Sensighty →<\u002Fa>\n<\u002Fdiv>\n<\u002Farticle>\n\n<article style=\"background: #F4F6FA; border: 1px solid #E1E6EF; border-radius: 22px; padding: 36px 32px; display: flex; flex-direction: column; gap: 20px\">\n<div style=\"width: 56px; height: 56px; border-radius: 14px; background: #0F1B33; display: flex; align-items: center; justify-content: center\">\n<svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"{{accent}}\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"1.8\"><\u002Fcircle><ellipse cx=\"12\" cy=\"12\" rx=\"10\" ry=\"4\"><\u002Fellipse><ellipse cx=\"12\" cy=\"12\" rx=\"10\" ry=\"4\" transform=\"rotate(60 12 12)\"><\u002Fellipse><ellipse cx=\"12\" cy=\"12\" rx=\"10\" ry=\"4\" transform=\"rotate(120 12 12)\"><\u002Fellipse><\u002Fsvg>\n<\u002Fdiv>\n<div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.12em; color: #0E7490\">02 · QUANTUM READINESS<\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 28px; font-weight: 800; line-height: 1.15\">Quantum-Safe Security &amp; Quantum Software<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #4A5A78\">Prepare your systems for the quantum era today, from the software and security side. No hardware hype.<\u002Fp>\n<ul style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; font-size: 15px; color: #2B3A57\">\n<li>Quantum-readiness assessment<\u002Fli>\n<li>Post-quantum cryptography migration planning<\u002Fli>\n<li>Quantum algorithms, optimisation &amp; simulation<\u002Fli>\n<\u002Ful>\n<div style=\"margin-top: auto; padding-top: 18px; border-top: 1px solid #E1E6EF; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap\">\n<span style=\"font-size: 14px; color: #5B6B88\">Start with<\u002Fspan>\n<a href=\"#contact\" style=\"font-weight: 800; font-size: 16px; min-height: 44px; display: inline-flex; align-items: center\">Readiness assessment →<\u002Fa>\n<\u002Fdiv>\n<\u002Farticle>\n\n<article style=\"background: #F4F6FA; border: 1px solid #E1E6EF; border-radius: 22px; padding: 36px 32px; display: flex; flex-direction: column; gap: 20px\">\n<div style=\"width: 56px; height: 56px; border-radius: 14px; background: #0F1B33; display: flex; align-items: center; justify-content: center\">\n<svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"{{accent}}\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6l8-3z\"><\u002Fpath><path d=\"M8.5 12l2.5 2.5 4.5-5\"><\u002Fpath><\u002Fsvg>\n<\u002Fdiv>\n<div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.12em; color: #0E7490\">03 · SECURE ARCHITECTURE<\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 28px; font-weight: 800; line-height: 1.15\">Security by Design, in every system<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #4A5A78\">Security is engineered in from the first design decision, never bolted on after launch.<\u002Fp>\n<ul style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; font-size: 15px; color: #2B3A57\">\n<li>Secure architecture &amp; threat modelling<\u002Fli>\n<li>Application, API, cloud &amp; AI security<\u002Fli>\n<li>Data protection, privacy &amp; compliance<\u002Fli>\n<\u002Ful>\n<div style=\"margin-top: auto; padding-top: 18px; border-top: 1px solid #E1E6EF; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap\">\n<span style=\"font-size: 14px; color: #5B6B88\">Start with<\u002Fspan>\n<a href=\"#contact\" style=\"font-weight: 800; font-size: 16px; min-height: 44px; display: inline-flex; align-items: center\">Architecture review →<\u002Fa>\n<\u002Fdiv>\n<\u002Farticle>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- TWO WAYS TO WORK -->\n<section id=\"work\" style=\"padding: 112px 24px\">\n<div style=\"max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px\">\n<div style=\"display: flex; flex-direction: column; gap: 16px; max-width: 760px\">\n<div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.14em; color: #0E7490\">TWO WAYS TO WORK WITH US<\u002Fdiv>\n<h2 style=\"margin: 0; font-size: clamp(32px, 3.6vw, 46px); line-height: 1.1; font-weight: 800; letter-spacing: -0.015em\">Need a decision, or need it built?<\u002Fh2>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.6; color: #4A5A78\">Advisory is independent. If the best answer is to buy, adopt an existing tool, or not build at all, that is what we recommend.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 22px\">\n\n<div style=\"background: #FFFFFF; border: 2px solid #0F1B33; border-radius: 24px; padding: 40px 36px; display: flex; flex-direction: column; gap: 22px\">\n<div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap\">\n<span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.12em; color: #0E7490\">TECHNOLOGY ADVISORY<\u002Fspan>\n<span style=\"font-size: 13px; font-weight: 700; background: #E6F6FA; color: #0E5A6E; padding: 6px 12px; border-radius: 999px\">You get a recommendation<\u002Fspan>\n<\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 32px; font-weight: 800; line-height: 1.15\">Decide what to build, buy, adopt or avoid.<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #4A5A78\">Before you commit budget, we pressure-test the requirement against the real business problem.<\u002Fp>\n<ul style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px; font-size: 16px; color: #2B3A57\">\n<li style=\"display: flex; gap: 10px\"><span style=\"color: #0E7490; font-weight: 800\">→<\u002Fspan>Architecture &amp; technology evaluation<\u002Fli>\n<li style=\"display: flex; gap: 10px\"><span style=\"color: #0E7490; font-weight: 800\">→<\u002Fspan>Build vs buy · AI vs deterministic · cloud vs on-premise<\u002Fli>\n<li style=\"display: flex; gap: 10px\"><span style=\"color: #0E7490; font-weight: 800\">→<\u002Fspan>Feasibility studies &amp; technology strategy<\u002Fli>\n<li style=\"display: flex; gap: 10px\"><span style=\"color: #0E7490; font-weight: 800\">→<\u002Fspan>Security, cost, vendor-dependency &amp; long-term risk review<\u002Fli>\n<\u002Ful>\n<div style=\"margin-top: auto; padding-top: 8px\">\n<a class=\"nx-btn\" href=\"#contact\" style=\"background: #0F1B33; color: #FFFFFF; padding: 16px 24px; border-radius: 12px; font-weight: 800; font-size: 16px; min-height: 52px; box-sizing: border-box; display: inline-flex; align-items: center\">Book a technology review<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"background: #0F1B33; color: #FFFFFF; border-radius: 24px; padding: 40px 36px; display: flex; flex-direction: column; gap: 22px\">\n<div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap\">\n<span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.12em; color: {{accent}}\">PRODUCTS &amp; SPECIALIST ENGINEERING<\u002Fspan>\n<span style=\"font-size: 13px; font-weight: 700; background: rgba(34,184,212,0.16); color: {{accent}}; padding: 6px 12px; border-radius: 999px\">You get a working system<\u002Fspan>\n<\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 32px; font-weight: 800; line-height: 1.15\">Use our products, or have us engineer yours.<\u002Fh3>\n<div style=\"display: flex; flex-direction: column; gap: 14px\">\n<div style=\"background: #17264A; border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px\">\n<div style=\"font-size: 17px; font-weight: 800\">Nexmancer products<\u002Fdiv>\n<div style=\"font-size: 15px; line-height: 1.55; color: #B8C2D6\">Proprietary platforms built in our focus areas, starting with Sensighty for adaptive learning.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background: #17264A; border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px\">\n<div style=\"font-size: 17px; font-weight: 800\">Specialist engineering<\u002Fdiv>\n<div style=\"font-size: 15px; line-height: 1.55; color: #B8C2D6\">Complex products and systems where we bring genuine domain depth. Not staff augmentation, not generic development.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top: auto; padding-top: 8px; display: flex; gap: 12px; flex-wrap: wrap\">\n<a class=\"nx-btn\" href=\"#sensighty\" style=\"background: {{accent}}; color: #0F1B33; padding: 16px 24px; border-radius: 12px; font-weight: 800; font-size: 16px; min-height: 52px; box-sizing: border-box; display: inline-flex; align-items: center\">See Sensighty<\u002Fa>\n<a class=\"nx-ghost\" href=\"#contact\" style=\"color: #FFFFFF; border: 1px solid rgba(255,255,255,0.28); padding: 16px 24px; border-radius: 12px; font-weight: 700; font-size: 16px; min-height: 52px; box-sizing: border-box; display: inline-flex; align-items: center\">Discuss a build<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- SENSIGHTY -->\n<section id=\"sensighty\" style=\"padding: 0 24px 112px\">\n<div style=\"max-width: 1240px; margin: 0 auto; background: #FFFFFF; border: 1px solid #E1E6EF; border-radius: 28px; padding: 56px 48px; display: flex; gap: 56px; align-items: center; flex-wrap: wrap\">\n<div style=\"flex: 1 1 440px; display: flex; flex-direction: column; gap: 20px\">\n<div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.14em; color: #0E7490\">FLAGSHIP PRODUCT · BY NEXMANCER<\u002Fdiv>\n<h2 style=\"margin: 0; font-size: clamp(34px, 3.8vw, 48px); line-height: 1.08; font-weight: 800; letter-spacing: -0.015em\">Sensighty: learning that starts with what people already know.<\u002Fh2>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.6; color: #4A5A78\">Completion is not competence. Sensighty diagnoses each learner first, skips what they have mastered and focuses practice on the real gaps.<\u002Fp>\n<div>\n<a class=\"nx-btn\" href=\"#contact\" style=\"background: #0F1B33; color: #FFFFFF; padding: 16px 24px; border-radius: 12px; font-weight: 800; font-size: 16px; min-height: 52px; box-sizing: border-box; display: inline-flex; align-items: center\">Request a Sensighty demo<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1 1 440px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px\">\n<div style=\"background: #F4F6FA; border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 6px\"><div style=\"font-size: 17px; font-weight: 800\">Diagnose first<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.5; color: #4A5A78\">Find what learners know before assigning anything.<\u002Fdiv><\u002Fdiv>\n<div style=\"background: #F4F6FA; border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 6px\"><div style=\"font-size: 17px; font-weight: 800\">Learner model<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.5; color: #4A5A78\">Mastery, strengths and gaps that update with every answer.<\u002Fdiv><\u002Fdiv>\n<div style=\"background: #F4F6FA; border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 6px\"><div style=\"font-size: 17px; font-weight: 800\">Adaptive difficulty<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.5; color: #4A5A78\">Harder when it’s easy, a step back when they struggle.<\u002Fdiv><\u002Fdiv>\n<div style=\"background: #F4F6FA; border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 6px\"><div style=\"font-size: 17px; font-weight: 800\">Targeted remediation<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.5; color: #4A5A78\">Fix the gap, not “redo the whole module”.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- FRAMEWORK -->\n<section style=\"padding: 112px 24px; background: #FFFFFF; border-top: 1px solid #E1E6EF\">\n<div style=\"max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px\">\n<div style=\"display: flex; flex-direction: column; gap: 16px; max-width: 760px\">\n<div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.14em; color: #0E7490\">THE NEXMANCER APPROACH<\u002Fdiv>\n<h2 style=\"margin: 0; font-size: clamp(32px, 3.6vw, 46px); line-height: 1.1; font-weight: 800; letter-spacing: -0.015em\">Intelligence → Engineering → Security → Outcome<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px\">\n<div style=\"border-top: 3px solid #0F1B33; padding-top: 20px; display: flex; flex-direction: column; gap: 8px\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #0E7490\">01<\u002Fdiv><div style=\"font-size: 22px; font-weight: 800\">Intelligence<\u002Fdiv><div style=\"font-size: 16px; line-height: 1.55; color: #4A5A78\">Understand the problem before choosing the technology.<\u002Fdiv><\u002Fdiv>\n<div style=\"border-top: 3px solid #0F1B33; padding-top: 20px; display: flex; flex-direction: column; gap: 8px\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #0E7490\">02<\u002Fdiv><div style=\"font-size: 22px; font-weight: 800\">Engineering<\u002Fdiv><div style=\"font-size: 16px; line-height: 1.55; color: #4A5A78\">Design and build the right solution, with AI accelerating our engineers, never replacing them.<\u002Fdiv><\u002Fdiv>\n<div style=\"border-top: 3px solid #0F1B33; padding-top: 20px; display: flex; flex-direction: column; gap: 8px\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #0E7490\">03<\u002Fdiv><div style=\"font-size: 22px; font-weight: 800\">Security<\u002Fdiv><div style=\"font-size: 16px; line-height: 1.55; color: #4A5A78\">Protect systems, data and users by design.<\u002Fdiv><\u002Fdiv>\n<div style=\"border-top: 3px solid {{accent}}; padding-top: 20px; display: flex; flex-direction: column; gap: 8px\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #0E7490\">04<\u002Fdiv><div style=\"font-size: 22px; font-weight: 800\">Outcome<\u002Fdiv><div style=\"font-size: 16px; line-height: 1.55; color: #4A5A78\">Deliver measurable business and learning value, not lines of code.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- CONTACT -->\n<section id=\"contact\" style=\"background: #0F1B33; color: #FFFFFF; padding: 112px 24px\">\n<div style=\"max-width: 1240px; margin: 0 auto; display: flex; gap: 64px; flex-wrap: wrap; align-items: flex-start\">\n<div style=\"flex: 1 inline-flex; align-items: center\">Explore Sensighty<\u002Fa>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 22px; flex-wrap: wrap; font-size: 14px; font-weight: 600; color: #8C99B3\">\n<span>Human expertise first<\u002Fspan><span aria-hidden=\"true\">·<\u002Fspan><span>AI as an accelerator<\u002Fspan><span aria-hidden=\"true\">·<\u002Fspan><span>Security by design<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"flex: 1 1 420px; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.12em; color: #8C99B3\">HOW AN ENGAGEMENT CHANGES · ILLUSTRATIVE<\u002Fdiv>\n<div style=\"background: #17264A; border: 1px solid rgba(255,255,255,0.08); border-radius: 18px; padding: 24px 26px; display: flex; flex-direction: column; gap: 8px\">\n<div style=\"font-size: 13px; font-weight: 700; color: #8C99B3; letter-spacing: 0.06em\">THE REQUEST<\u002Fdiv>\n<div style=\"font-size: 20px; font-weight: 600; color: #DCE3EF; line-height: 1.4\">“Build us an AI chatbot for employee training.”<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; justify-content: center\"><svg width=\"24\" height=\"28\" viewBox=\"0 0 24 28\" fill=\"none\" aria-hidden=\"true\"><path d=\"M12 2v22M4 16l8 8 8-8\" stroke=\"#8C99B3\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<div style=\"background: #17264A; border: 1px solid #22B8D4; border-radius: 18px; padding: 24px 26px; display: flex; flex-direction: column; gap: 8px\">\n<div style=\"font-size: 13px; font-weight: 700; color: #22B8D4; letter-spacing: 0.06em\">THE ROOT PROBLEM<\u002Fdiv>\n<div style=\"font-size: 20px; font-weight: 600; color: #FFFFFF; line-height: 1.4\">Employees sit through content they already know, and nobody measures what they actually learned.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; justify-content: center\"><svg width=\"24\" height=\"28\" viewBox=\"0 0 24 28\" fill=\"none\" aria-hidden=\"true\"><path d=\"M12 2v22M4 16l8 8 8-8\" stroke=\"#8C99B3\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<div style=\"background: #22B8D4; color: #0F1B33; border-radius: 18px; padding: 24px 26px; display: flex; flex-direction: column; gap: 8px\">\n<div style=\"font-size: 13px; font-weight: 800; letter-spacing: 0.06em\">THE RECOMMENDATION<\u002Fdiv>\n<div style=\"font-size: 20px; font-weight: 700; line-height: 1.4\">Diagnose first. Adaptive assessment that skips what people know and targets the real gaps.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"approach\" style=\"padding: 112px 24px\">\n<div style=\"max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px\">\n<div style=\"display: flex; flex-direction: column; gap: 16px; max-width: 760px\">\n<div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.14em; color: #0E7490\">OUR METHOD<\u002Fdiv>\n<h2 style=\"margin: 0; font-size: clamp(32px, 3.6vw, 46px); line-height: 1.1; font-weight: 800; letter-spacing: -0.015em\">Most firms start at “Build”. We get there last.<\u002Fh2>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.6; color: #4A5A78\">Development is the outcome of engineering analysis, not the starting point. Select a step to see what happens there.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px\">\n\n<button class=\"nx-step\" type=\"button\">\n<span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; opacity: 0.75\">{{s.num}}<\u002Fspan>\n<span style=\"font-size: 21px; font-weight: 800\">{{s.name}}<\u002Fspan>\n<span style=\"font-size: 13px; font-weight: 700; letter-spacing: 0.04em; opacity: 0.8\">{{s.tag}}<\u002Fspan>\n<\u002Fbutton>\n\n<\u002Fdiv>\n\n<div style=\"background: #FFFFFF; border: 1px solid #E1E6EF; border-radius: 18px; paddi " ry=\"4\" transform=\"rotate(60 12 12)\"><\u002Fellipse><ellipse cx=\"12\" cy=\"12\" rx=\"10\" ry=\"4\" transform=\"rotate(120 12 12)\"><\u002Fellipse><\u002Fsvg>\n<\u002Fdiv>\n<div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.12em; color: #0E7490\">02 · QUANTUM READINESS<\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 28px; font-weight: 800; line-height: 1.15\">Quantum-Safe Security &amp; Quantum Software<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #4A5A78\">Prepare your systems for the quantum era today, from the software and security side. No hardware hype.<\u002Fp>\n<ul style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; font-size: 15px; color: #2B3A57\">\n<li>Quantum-readiness assessment<\u002Fli>\n<li>Post-quantum cryptography migration planning<\u002Fli>\n<li>Quantum algorithms, optimisation &amp; simulation<\u002Fli>\n<\u002Ful>\n<div style=\"margin-top: auto; padding-top: 18px; border-top: 1px solid #E1E6EF; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap\">\n<span style=\"font-size: 14px; color: #5B6B88\">Start with<\u002Fspan>\n<a href=\"#contact\" style=\"font-weight: 800; font-size: 16px; min-height: 44px; display: inline-flex; align-items: center\">Readiness assessment →<\u002Fa>\n<\u002Fdiv>\n<\u002Farticle>\n\n<article style=\"background: #F4F6FA; border: 1px solid #E1E6EF; border-radius: 22px; padding: 36px 32px; display: flex; flex-direction: column; gap: 20px\">\n<div style=\"width: 56px; height: 56px; border-radius: 14px; background: #0F1B33; display: flex; align-items: center; justify-content: center\">\n<svg width=\"30\" height=\"30\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#22B8D4\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6l8-3z\"><\u002Fpath><path d=\"M8.5 12l2.5 2.5 4.5-5\"><\u002Fpath><\u002Fsvg>\n<\u002Fdiv>\n<div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.12em; color: #0E7490\">03 · SECURE ARCHITECTURE<\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 28px; font-weight: 800; line-height: 1.15\">Security by Design, in every system<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #4A5A78\">Security is engineered in from the first design decision, never bolted on after launch.<\u002Fp>\n<ul style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; font-size: 15px; color: #2B3A57\">\n<li>Secure architecture &amp; threat modelling<\u002Fli>\n<li>Application, API, cloud &amp; AI security<\u002Fli>\n<li>Data protection, privacy &amp; compliance<\u002Fli>\n<\u002Ful>\n<div style=\"margin-top: auto; padding-top: 18px; border-top: 1px solid #E1E6EF; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap\">\n<span style=\"font-size: 14px; color: #5B6B88\">Start with<\u002Fspan>\n<a href=\"#contact\" style=\"font-weight: 800; font-size: 16px; min-height: 44px; display: inline-flex; align-items: center\">Architecture review →<\u002Fa>\n<\u002Fdiv>\n<\u002Farticle>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"work\" style=\"padding: 112px 24px\">\n<div style=\"max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px\">\n<div style=\"display: flex; flex-direction: column; gap: 16px; max-width: 760px\">\n<div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.14em; color: #0E7490\">TWO WAYS TO WORK WITH US<\u002Fdiv>\n<h2 style=\"margin: 0; font-size: clamp(32px, 3.6vw, 46px); line-height: 1.1; font-weight: 800; letter-spacing: -0.015em\">Need a decision, or need it built?<\u002Fh2>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.6; color: #4A5A78\">Advisory is independent. If the best answer is to buy, adopt an existing tool, or not build at all, that is what we recommend.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 22px\">\n\n<div style=\"background: #FFFFFF; border: 2px solid #0F1B33; border-radius: 24px; padding: 40px 36px; display: flex; flex-direction: column; gap: 22px\">\n<div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap\">\n<span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.12em; color: #0E7490\">TECHNOLOGY ADVISORY<\u002Fspan>\n<span style=\"font-size: 13px; font-weight: 700; background: #E6F6FA; color: #0E5A6E; padding: 6px 12px; border-radius: 999px\">You get a recommendation<\u002Fspan>\n<\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 32px; font-weight: 800; line-height: 1.15\">Decide what to build, buy, adopt or avoid.<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #4A5A78\">Before you commit budget, we pressure-test the requirement against the real business problem.<\u002Fp>\n<ul style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px; font-size: 16px; color: #2B3A57\">\n<li style=\"display: flex; gap: 10px\"><span style=\"color: #0E7490; font-weight: 800\">→<\u002Fspan>Architecture &amp; technology evaluation<\u002Fli>\n<li style=\"display: flex; gap: 10px\"><span style=\"color: #0E7490; font-weight: 800\">→<\u002Fspan>Build vs buy · AI vs deterministic · cloud vs on-premise<\u002Fli>\n<li style=\"display: flex; gap: 10px\"><span style=\"color: #0E7490; font-weight: 800\">→<\u002Fspan>Feasibility studies &amp; technology strategy<\u002Fli>\n<li style=\"display: flex; gap: 10px\"><span style=\"color: #0E7490; font-weight: 800\">→<\u002Fspan>Security, cost, vendor-dependency &amp; long-term risk review<\u002Fli>\n<\u002Ful>\n<div style=\"margin-top: auto; padding-top: 8px\">\n<a class=\"nx-btn\" href=\"#contact\" style=\"background: #0F1B33; color: #FFFFFF; padding: 16px 24px; border-radius: 12px; font-weight: 800; font-size: 16px; min-height: 52px; box-sizing: border-box; display: inline-flex; align-items: center\">Book a technology review<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"background: #0F1B33; color: #FFFFFF; border-radius: 24px; padding: 40px 36px; display: flex; flex-direction: column; gap: 22px\">\n<div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap\">\n<span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.12em; color: #22B8D4\">PRODUCTS &amp; SPECIALIST ENGINEERING<\u002Fspan>\n<span style=\"font-size: 13px; font-weight: 700; background: rgba(34,184,212,0.16); color: #22B8D4; padding: 6px 12px; border-radius: 999px\">You get a working system<\u002Fspan>\n<\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 32px; font-weight: 800; line-height: 1.15\">Use our products, or have us engineer yours.<\u002Fh3>\n<div style=\"display: flex; flex-direction: column; gap: 14px\">\n<div style=\"background: #17264A; border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px\">\n<div style=\"font-size: 17px; font-weight: 800\">Nexmancer products<\u002Fdiv>\n<div style=\"font-size: 15px; line-height: 1.55; color: #B8C2D6\">Proprietary platforms built in our focus areas, starting with Sensighty for adaptive learning.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background: #17264A; border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px\">\n<div style=\"font-size: 17px; font-weight: 800\">Specialist engineering<\u002Fdiv>\n<div style=\"font-size: 15px; line-height: 1.55; color: #B8C2D6\">Complex products and systems where we bring genuine domain depth. Not staff augmentation, not generic development.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top: auto; padding-top: 8px; display: flex; gap: 12px; flex-wrap: wrap\">\n<a class=\"nx-btn\" href=\"#sensighty\" style=\"background: #22B8D4; color: #0F1B33; padding: 16px 24px; border-radius: 12px; font-weight: 800; font-size: 16px; min-height: 52px; box-sizing: border-box; display: inline-flex; align-items: center\">See Sensighty<\u002Fa>\n<a class=\"nx-ghost\" href=\"#contact\" style=\"color: #FFFFFF; border: 1px solid rgba(255,255,255,0.28); padding: 16px 24px; border-radius: 12px; font-weight: 700; font-size: 16px; min-height: 52px; box-sizing: border-box; display: inline-flex; align-items: center\">Discuss a build<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"sensighty\" style=\"padding: 0 24px 112px\">\n<div style=\"max-width: 1240px; margin: 0 auto; background: #FFFFFF; border: 1px solid #E1E6EF; border-radius: 28px; padding: 56px 48px; display: flex; gap: 56px; align-items: center; flex-wrap: wrap\">\n<div style=\"flex: 1 1 440px; display: flex; flex-direction: column; gap: 20px\">\n<div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.14em; color: #0E7490\">FLAGSHIP PRODUCT · BY NEXMANCER<\u002Fdiv>\n<h2 style=\"margin: 0; font-size: clamp(34px, 3.8vw, 48px); line-height: 1.08; font-weight: 800; letter-spacing: -0.015em\">Sensighty: learning that starts with what people already know.<\u002Fh2>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.6; color: #4A5A78\">Completion is not competence. Sensighty diagnoses each learner first, skips what they have mastered and focuses practice on the real gaps.<\u002Fp>\n<div>\n<a class=\"nx-btn\" href=\"#contact\" style=\"background: #0F1B33; color: #FFFFFF; padding: 16px 24px; border-radius: 12px; font-weight: 800; font-size: 16px; min-height: 52px; box-sizing: border-box; display: inline-flex; align-items: center\">Request a Sensighty demo<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1 1 440px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px\">\n<div style=\"background: #F4F6FA; border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 6px\"><div style=\"font-size: 17px; font-weight: 800\">Diagnose first<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.5; color: #4A5A78\">Find what learners know before assigning anything.<\u002Fdiv><\u002Fdiv>\n<div style=\"background: #F4F6FA; border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 6px\"><div style=\"font-size: 17px; font-weight: 800\">Learner model<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.5; color: #4A5A78\">Mastery, strengths and gaps that update with every answer.<\u002Fdiv><\u002Fdiv>\n<div style=\"background: #F4F6FA; border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 6px\"><div style=\"font-size: 17px; font-weight: 800\">Adaptive difficulty<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.5; color: #4A5A78\">Harder when it’s easy, a step back when they struggle.<\u002Fdiv><\u002Fdiv>\n<div style=\"background: #F4F6FA; border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 6px\"><div style=\"font-size: 17px; font-weight: 800\">Targeted remediation<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.5; color: #4A5A78\">Fix the gap, not “redo the whole module”.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section style=\"padding: 112px 24px; background: #FFFFFF; border-top: 1px solid #E1E6EF\">\n<div style=\"max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px\">\n<div style=\"display: flex; flex-direction: column; gap: 16px; max-width: 760px\">\n<div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.14em; color: #0E7490\">THE NEXMANCER APPROACH<\u002Fdiv>\n<h2 style=\"margin: 0; font-size: clamp(32px, 3.6vw, 46px); line-height: 1.1; font-weight: 800; letter-spacing: -0.015em\">Intelligence → Engineering → Security → Outcome<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px\">\n<div style=\"border-top: 3px solid #0F1B33; padding-top: 20px; display: flex; flex-direction: column; gap: 8px\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #0E7490\">01<\u002Fdiv><div style=\"font-size: 22px; font-weight: 800\">Intelligence<\u002Fdiv><div style=\"font-size: 16px; line-height: 1.55; color: #4A5A78\">Understand the problem before choosing the technology.<\u002Fdiv><\u002Fdiv>\n<div style=\"border-top: 3px solid #0F1B33; padding-top: 20px; display: flex; flex-direction: column; gap: 8px\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #0E7490\">02<\u002Fdiv><div style=\"font-size: 22px; font-weight: 800\">Engineering<\u002Fdiv><div style=\"font-size: 16px; line-height: 1.55; color: #4A5A78\">Design and build the right solution, with AI accelerating our engineers, never replacing them.<\u002Fdiv><\u002Fdiv>\n<div style=\"border-top: 3px solid #0F1B33; padding-top: 20px; display: flex; flex-direction: column; gap: 8px\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #0E7490\">03<\u002Fdiv><div style=\"font-size: 22px; font-weight: 800\">Security<\u002Fdiv><div style=\"font-size: 16px; line-height: 1.55; color: #4A5A78\">Protect systems, data and users by design.<\u002Fdiv><\u002Fdiv>\n<div style=\"border-top: 3px solid #22B8D4; padding-top: 20px; display: flex; flex-direction: column; gap: 8px\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #0E7490\">04<\u002Fdiv><div style=\"font-size: 22px; font-weight: 800\">Outcome<\u002Fdiv><div style=\"font-size: 16px; line-height: 1.55; color: #4A5A78\">Deliver measurable business and learning value, not lines of code.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"contact\" style=\"background: #0F1B33; color: #FFFFFF; padding: 112px 24px\">\n<div style=\"max-width: 1240px; margin: 0 auto; display: flex; gap: 64px; flex-wrap: wrap; align-items: flex-start\">\n<div style=\"flex: 1 1 460px; display: flex; flex-direction: column; gap: 22px\">\n<div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.14em; color: #22B8D4\">BEFORE YOU BUILD IT<\u002Fdiv>\n<h2 style=\"margin: 0; font-size: clamp(34px, 4vw, 52px); line-height: 1.06; font-weight: 800; letter-spacing: -0.02em\">Let’s make sure it’s the right thing to build.<\u002Fh2>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.6; color: #B8C2D6\">Tell us what you’ve been asked to build. We’ll come back with the questions that matter, and an honest view of whether to build, buy, adopt or avoid.<\u002Fp>\n<div style=\"display: flex; flex-direction: column; gap: 10px; font-size: 16px; color: #DCE3EF\">\n<div>Email: <a href=\"mailto:[YOUR EMAIL]\" style=\"color: #22B8D4; font-weight: 700\">[YOUR EMAIL]<\u002Fa><\u002Fdiv>\n<div>Web: <a href=\"https://nexmancer.com\" style=\"color: #22B8D4; font-weight: 700\">nexmancer.com<\u002Fa><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<form style=\"flex: 1 1 420px; background: #17264A; border: 1px solid rgba(255,255,255,0.08); border-radius: 22px; padding: 32px; display: flex; flex-direction: column; gap: 18px\">\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<label for=\"nx-name\" style=\"font-size: 14px; font-weight: 700; color: #DCE3EF\">Name<\u002Flabel>\n<input id=\"nx-name\" type=\"text\" autocomplete=\"name\" style=\"background: #0F1B33; border: 1px solid #33456E; border-radius: 10px; padding: 14px 16px; font-size: 16px; color: #FFFFFF; min-height: 48px; box-sizing: border-box\">\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<label for=\"nx-email\" style=\"font-size: 14px; font-weight: 700; color: #DCE3EF\">Work email<\u002Flabel>\n<input id=\"nx-email\" type=\"email\" autocomplete=\"email\" style=\"background: #0F1B33; border: 1px solid #33456E; border-radius: 10px; padding: 14px 16px; font-size: 16px; color: #FFFFFF; min-height: 48px; box-sizing: border-box\">\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<label for=\"nx-need\" style=\"font-size: 14px; font-weight: 700; color: #DCE3EF\">I’m interested in<\u002Flabel>\n<select id=\"nx-need\" style=\"background: #0F1B33; border: 1px solid #33456E; border-radius: 10px; padding: 14px 16px; font-size: 16px; color: #FFFFFF; min-height: 48px; box-sizing: border-box; font-family: inherit\">\n<option>Technology advisory<\u002Foption>\n<option>Sensighty demo<\u002Foption>\n<option>Quantum-readiness assessment<\u002Foption>\n<option>Secure architecture review<\u002Foption>\n<option>Specialist engineering<\u002Foption>\n<\u002Fselect>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<label for=\"nx-msg\" style=\"font-size: 14px; font-weight: 700; color: #DCE3EF\">What were you asked to build?<\u002Flabel>\n<textarea id=\"nx-msg\" rows=\"4\" style=\"background: #0F1B33; border: 1px solid #33456E; border-radius: 10px; padding: 14px 16px; font-size: 16px; color: #FFFFFF; resize: vertical; box-sizing: border-box\"><\u002Ftextarea>\n<\u002Fdiv>\n<button class=\"nx-btn\" type=\"button\" style=\"background: #22B8D4; color: #0F1B33; border: none; padding: 16px 24px; border-radius: 12px; font-weight: 800; font-size: 16px; min-height: 52px; cursor: pointer\">Request a technology review<\u002Fbutton>\n<\u002Fform>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<footer style=\"background: #0B1428; color: #8C99B3; padding: 40px 24px\">\n<div style=\"max-width: 1240px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap\">\n<div style=\"display: flex; align-items: center; gap: 12px\">\n<svg width=\"30\" height=\"30\" viewBox=\"0 0 100 100\" fill=\"none\" aria-hidden=\"true\"><polygon points=\"50,6 88,28 88,72 50,94 12,72 12,28\" stroke=\"#FFFFFF\" stroke-width=\"8\" stroke-linejoin=\"round\"><\u002Fpolygon><polyline points=\"38,36 58,50 38,64\" stroke=\"#22B8D4\" stroke-width=\"10\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpolyline><\u002Fsvg>\n<span style=\"color: #FFFFFF; font-weight: 800; letter-spacing: 0.16em; font-size: 16px\">NEXMANCER<\u002Fspan>\n<\u002Fdiv>\n<div style=\"font-size: 15px; font-weight: 600\">Human Expertise. Emerging Technology. Secure Engineering.<\u002Fdiv>\n<div style=\"font-size: 14px\">© 2026 Nexmancer Pvt Ltd<\u002Fdiv>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fsc-if><\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#22B8D4&quot;,&quot;options&quot;:[&quot;#22B8D4&quot;,&quot;#2DD4BF&quot;,&quot;#60A5FA&quot;]},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:5200}}\">\nclass Component extends DCLogic {\n  constructor(props) { super(props); this.state = { step: 0 }; }\n  renderVals() {\n    const accent = this.props.accent ?? '#22B8D4';\n    const data = [\n      { name: 'Analyse', tag: 'WE START HERE', desc: 'We dig into the business problem behind the request: who is affected, what it costs today and what success would actually look like.' },\n      { name: 'Evaluate', tag: 'OPTIONS', desc: 'We compare build vs buy, AI vs deterministic approaches, cloud vs on-premise, technology maturity, cost and vendor dependency.' },\n      { name: 'Architect', tag: 'SECURE BY DESIGN', desc: 'We design the solution with security, privacy, scalability and maintainability built in from the first decision.' },\n      { name: 'Recommend', tag: 'HONEST ADVICE', desc: 'You get a clear recommendation, including when the right answer is to buy, adopt an existing tool, or not build at all.' },\n      { name: 'Build', tag: 'MOST FIRMS START HERE', desc: 'Only now do we engineer, with AI accelerating our engineers while architecture and accountability stay human-led.' },\n      { name: 'Validate', tag: 'OUTCOME', desc: 'We test against the original problem, not just the specification, so the result delivers measurable value.' }\n    ];\n    const steps = data.map((d, i) => {\n      const on = i === this.state.step;\n      const isBuild = i === 4;\n      const bg = on ? '#0F1B33' : '#FFFFFF';\n      const fg = on ? '#FFFFFF' : '#0F1B33';\n      const border = on ? '#0F1B33' : (isBuild ? '#94A3B8' : '#E1E6EF');\n      return {\n        num: String(i + 1).padStart(2, '0'),\n        name: d.name,\n        tag: d.tag,\n        pressed: on ? 'true' : 'false',\n        style: 'all: unset; box-sizing: border-box; cursor: pointer; min-height: 128px; padding: 20px 20px; border-radius: 16px; display: flex; flex-direction: column; gap: 8px; background: ' + bg + '; color: ' + fg + '; border: 2px ' + (isBuild && !on ? 'dashed ' : 'solid ') + border + '; font-family: Manrope, system-ui, sans-serif',\n        pick: () => this.setState({ step: i })\n      };\n    });\n    const a = data[this.state.step];\n    return { accent, steps, active: { num: String(this.state.step + 1).padStart(2, '0'), name: a.name, desc: a.desc } };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
